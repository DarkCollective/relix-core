# Build-wide Gradle settings.
#
# Deliberately two lines. This file is NOT where the toolchain is configured: the
# project targets Java 21 because that is the floor under every consumer of the
# published artifact, `languageVersion` says so in build.gradle, and a property
# here overriding it would move that floor invisibly.
#
# The remote build cache is not here either, and cannot be. Cache configuration
# belongs in an init script (tools/ci/build-cache.init.gradle) because it is
# environment-specific — but the binding reason is that settings.gradle is
# *published*: export.py's write_settings copies everything above the first
# `include ` verbatim into the public tree, so a bucket named there would be a
# bucket named in a public repository.

# Reuse a task's output when its inputs have not changed, including across a
# `clean`. Test tasks are cacheable too, so an unchanged module does not re-test.
org.gradle.caching=true

# 24 modules, most of them independent. Without this they build one at a time.
org.gradle.parallel=true
