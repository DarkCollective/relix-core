# The public engine's gate.
#
# This runs on every push and every pull request, which is the opposite of the
# private repository's arrangement — there CI is `workflow_dispatch` only, on the
# argument that a local `./gradlew clean build` is the real gate and a hosted run
# adds nothing a developer has not already done.
#
# That argument does not survive contact with contributors. A pull request from
# someone else is precisely the case where nobody has run the gate on the change,
# and "a green PR is not evidence that anything was verified" stops being a
# footnote and becomes the normal state. The coverage ratchet drifting red for 23
# commits without anyone noticing is what that looks like from the inside.
#
# It needs no secrets, so it is safe on a fork's pull request: the build is
# hermetic by design — no Docker, no network, no database — and the heavier tiers
# that need those are excluded from it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      # The whole gate: compilation, the fast hermetic tests, both manuals'
      # guards, the coverage ratchet, and Javadoc.
      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
