// relix-dist — the published artifacts.
//
// A client writes `com.darkcollective.relix:relix` and gets the engine, the grammar,
// the runtime and the shipped providers. Two optional artifacts sit beside it, each
// added by name: `relix-docs`, the language reference (which the engine never reads),
// and `relix-solver-ojalgo`, the solver only OPTIMIZE and COVER EXACT need. `relix-all`
// is a POM naming all three. No class is in more than one jar (`checkArtifacts`).
// The modules this is assembled from are not
// published: their boundaries are claims *this* build enforces, and publishing them
// would turn nineteen internals into coordinates a client can name, pin, and be broken
// by — a far larger promise than we would defend.
//
// The jar is assembled rather than compiled. Each bundled module's own
// `module-info.class` is dropped and replaced by this project's, which exports exactly
// the packages a caller may reach; `META-INF/services` files are concatenated, because
// three modules declare providers under names that would otherwise overwrite each other.
apply plugin: 'maven-publish'

description = 'Relix — a relational algebra engine for the JVM.'

def bundled = rootProject.ext.bundledModules.collect { project(it) }

// The two optional artifacts are assembled here too, so that one staging directory, one
// set of POM checks and one consumer test cover everything that is published.
evaluationDependsOn(':relix-docs')
evaluationDependsOn(':relix-solver-ojalgo')
def docsProject = project(':relix-docs')
def solverProject = project(':relix-solver-ojalgo')

// The solver's one third-party dependency. Not merged, deliberately: shading a library
// hides it from a client's dependency report and from their vulnerability scanning. It
// is a normal transitive dependency of relix-solver-ojalgo, and of nothing else.
def ojalgoVersion = '56.2.1'
configurations {
    ojalgo
}
dependencies {
    ojalgo "org.ojalgo:ojalgo:${ojalgoVersion}"
}

// The merged service declarations. Concatenated rather than copied, because
// `META-INF/services/...RelixConnector` exists in more than one module and the last
// copy would otherwise be the only one — a discovery failure that shows up as a
// missing connector at runtime and nowhere earlier.
def servicesDir = layout.buildDirectory.dir('merged/services')

def mergeServices = tasks.register('mergeServices') {
    description = 'Concatenates the bundled modules\' META-INF/services declarations.'
    dependsOn bundled.collect { it.tasks.named('processResources') }
    bundled.each { inputs.files(it.sourceSets.main.output.resourcesDir).withPropertyName(it.name).optional() }
    outputs.dir(servicesDir)
    doLast {
        def out = servicesDir.get().asFile
        out.deleteDir()
        def merged = [:].withDefault { [] as Set }
        bundled.each { p ->
            def dir = new File(p.sourceSets.main.output.resourcesDir, 'META-INF/services')
            if (dir.isDirectory()) {
                dir.eachFile { f -> merged[f.name].addAll(f.readLines().findAll { it.trim() }) }
            }
        }
        def target = new File(out, 'META-INF/services')
        target.mkdirs()
        merged.each { name, providers ->
            new File(target, name).text = providers.join('\n') + '\n'
        }
    }
}

// The classes, gathered into one tree. Each module's own descriptor is dropped — this
// project's replaces it — and the service files are superseded by the merged copies.
def mergedClasses = layout.buildDirectory.dir('merged/classes')

def mergeClasses = tasks.register('mergeClasses', Sync) {
    description = 'Gathers the bundled modules\' classes into one tree.'
    into mergedClasses
    bundled.each { p ->
        from(p.sourceSets.main.output) {
            exclude 'module-info.class'
            exclude 'META-INF/services/**'
        }
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL   // a package collision must not pass quietly
}

// The descriptor is compiled *against the gathered classes*, patched into the module
// being declared. That is the only way a module-info can export packages whose classes
// were compiled elsewhere — and it is what makes the export list enforceable rather
// than decorative: a package named here that is not in the tree fails the build.
def compileModuleInfo = tasks.register('compileModuleInfo', JavaCompile) {
    dependsOn mergeClasses
    source = files('src/main/java/module-info.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('merged/descriptor')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        options.compilerArgs += [
                '--patch-module', "com.darkcollective.relix=${mergedClasses.get().asFile}",
                '--module-version', project.version.toString(),
        ]
    }
}

// Nothing of this project's own is compiled or documented the ordinary way: the one
// source file is a module descriptor that only resolves against the gathered classes,
// and the published javadoc is the aggregate run over the modules themselves.
compileJava {
    enabled = false
}

// Inside this build a project dependency is normally served as its classes directory,
// which here is empty: the classes are merged into the jar, never compiled. The front
// ends depend on this project exactly as a program outside the repository depends on the
// published artifact (#1132), so the jar is the only thing it offers.
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.variants.removeAll(outgoing.variants.findAll { it.name in ['classes', 'resources'] })
    }
}

javadoc {
    enabled = false
}

jar {
    archiveBaseName = 'relix'
    dependsOn mergeServices, compileModuleInfo
    from mergedClasses
    from servicesDir
    from compileModuleInfo.map { it.destinationDirectory }
    // Apache-2.0 section 4(a)/(d): a recipient of the artifact gets the licence it is
    // under, and the NOTICE that travels with it, without having to find the repository.
    from(rootProject.file('LICENSE.txt')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
    manifest {
        attributes(
                'Implementation-Title': 'relix',
                'Implementation-Version': project.version)
    }
}

// Sources and javadoc for the assembled artifact come from the same set the classes do,
// so what a client steps into is what they are running.
def sourcesJar = tasks.register('relixSourcesJar', Jar) {
    archiveBaseName = 'relix'
    archiveClassifier = 'sources'
    bundled.each { p -> from p.sourceSets.main.allSource }
    from 'src/main/java'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The manuals' source, published with each release (com.darkcollective.relix:relix:<v>:manuals@zip).
// The front ends render the manuals and run their worked examples, and they read both from
// the engine release they build against, not from a copy of this tree. Everything a page
// refers to travels with it: the indexes, the fixture script and the fixture files.
def manualsZip = tasks.register('relixManualsZip', Zip) {
    archiveBaseName = 'relix'
    archiveClassifier = 'manuals'
    from(rootProject.file('docs/reference')) { into 'reference' }
    from(rootProject.file('docs/guide')) { into 'guide' }
    from(rootProject.file('docs/problem-solving')) { into 'problem-solving' }
    from(rootProject.file('README.md'))
    // A zip is reproducible only when its entries are ordered and undated.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def javadocJar = tasks.register('relixJavadocJar', Jar) {
    archiveBaseName = 'relix'
    archiveClassifier = 'javadoc'
    from rootProject.tasks.named('javadocAll')
}

// ---------------------------------------------------------------------------
// relix-docs — the language reference and the API that reads it.
//
// A real module of its own, with nothing to merge: its jar is its classes, its resources
// (the pages) and its descriptor, plus the licence files every published jar carries.
// ---------------------------------------------------------------------------
def docsJar = tasks.register('docsJar', Jar) {
    archiveBaseName = 'relix-docs'
    from docsProject.sourceSets.main.output
    from(rootProject.file('LICENSE.txt')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
    manifest {
        attributes('Implementation-Title': 'relix-docs', 'Implementation-Version': project.version)
    }
}

def docsSourcesJar = tasks.register('docsSourcesJar', Jar) {
    archiveBaseName = 'relix-docs'
    archiveClassifier = 'sources'
    from docsProject.sourceSets.main.allJava
}

def docsJavadocJar = tasks.register('docsJavadocJar', Jar) {
    archiveBaseName = 'relix-docs'
    archiveClassifier = 'javadoc'
    from docsProject.tasks.named('javadoc')
}

// ---------------------------------------------------------------------------
// relix-solver-ojalgo — the solver, as a provider a client adds.
//
// Its classes are relix-solver-ojalgo's, but not its descriptor: inside this build it
// requires the solver SPI's own module, which outside it is part of
// com.darkcollective.relix. So, as for the engine, the published descriptor is compiled
// here against the published engine jar, patched into the module being declared.
// ---------------------------------------------------------------------------
def solverClasses = layout.buildDirectory.dir('solver/classes')

def mergeSolverClasses = tasks.register('mergeSolverClasses', Sync) {
    description = 'Gathers the solver provider\'s classes, without its in-build descriptor.'
    into solverClasses
    from(solverProject.sourceSets.main.output) {
        exclude 'module-info.class'
    }
}

def compileSolverModuleInfo = tasks.register('compileSolverModuleInfo', JavaCompile) {
    dependsOn mergeSolverClasses, tasks.named('jar')
    source = files('src/solver/java/module-info.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('solver/descriptor')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    def engineJar = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(engineJar)
    inputs.files(configurations.ojalgo)
    doFirst {
        options.compilerArgs += [
                '--module-path', files(engineJar, configurations.ojalgo).asPath,
                '--patch-module', "com.darkcollective.relix.solver.ojalgo=${solverClasses.get().asFile}",
                '--module-version', project.version.toString(),
        ]
    }
}

def solverJar = tasks.register('solverJar', Jar) {
    archiveBaseName = 'relix-solver-ojalgo'
    dependsOn compileSolverModuleInfo
    from solverClasses
    from compileSolverModuleInfo.map { it.destinationDirectory }
    from(rootProject.file('LICENSE.txt')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
    manifest {
        attributes('Implementation-Title': 'relix-solver-ojalgo', 'Implementation-Version': project.version)
    }
}

def solverSourcesJar = tasks.register('solverSourcesJar', Jar) {
    archiveBaseName = 'relix-solver-ojalgo'
    archiveClassifier = 'sources'
    from(solverProject.sourceSets.main.allJava) {
        exclude 'module-info.java'
    }
    from 'src/solver/java'
}

def solverJavadocJar = tasks.register('solverJavadocJar', Jar) {
    archiveBaseName = 'relix-solver-ojalgo'
    archiveClassifier = 'javadoc'
    from solverProject.tasks.named('javadoc')
}

// Maven Central will not accept a POM missing any of name, description, url, licenses,
// scm or developers, and it says so at upload time — the one moment when the version
// number is already tagged and the mistake is expensive. `validatePom` below asks the
// same questions during `check`.
//
// `url` is the project's home page and `scm` is where its source lives — two different
// questions, so they name two different places. The home page is the website a reader
// who has only the coordinate should land on; the source is the public repository,
// relix-core, which is what the artifacts actually are and what releases them.
//
// Dependencies are written by hand: these publications are assembled artifacts rather
// than components, so Gradle knows of none. Each entry is [artifactId, version, scope].
def describe = { MavenPom pom, String artifactName, String text, List<List<String>> dependencies ->
    pom.name = artifactName
    pom.description = text
    pom.url = 'https://relix.darkcollective.com'
    pom.licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        }
    }
    pom.developers {
        developer {
            name = 'David Tooke'
            organization = 'DarkCollective'
            organizationUrl = 'https://github.com/DarkCollective'
        }
    }
    pom.scm {
        connection = 'scm:git:https://github.com/DarkCollective/relix-core.git'
        developerConnection = 'scm:git:ssh://git@github.com/DarkCollective/relix-core.git'
        url = 'https://github.com/DarkCollective/relix-core'
    }
    if (dependencies) {
        pom.withXml {
            def deps = asNode().appendNode('dependencies')
            dependencies.each { coordinate ->
                def (group, artifact, version, scope) = coordinate
                def dep = deps.appendNode('dependency')
                dep.appendNode('groupId', group)
                dep.appendNode('artifactId', artifact)
                dep.appendNode('version', version)
                dep.appendNode('scope', scope)
            }
        }
    }
}

def relixGroup = 'com.darkcollective.relix'
def sameVersion = { String artifact, String scope -> [relixGroup, artifact, project.version.toString(), scope] }

publishing {
    publications {
        // The engine. It depends on nothing: the solver and its library left with
        // relix-solver-ojalgo, and the pages with relix-docs.
        relix(MavenPublication) {
            artifactId = 'relix'
            artifact tasks.named('jar')
            artifact sourcesJar
            artifact javadocJar
            artifact manualsZip
            describe(pom, 'relix', project.description, [])
        }
        docs(MavenPublication) {
            artifactId = 'relix-docs'
            artifact docsJar
            artifact docsSourcesJar
            artifact docsJavadocJar
            describe(pom, 'relix-docs',
                    'The Relix language reference, and the API a tool reads it with.', [])
        }
        solver(MavenPublication) {
            artifactId = 'relix-solver-ojalgo'
            artifact solverJar
            artifact solverSourcesJar
            artifact solverJavadocJar
            describe(pom, 'relix-solver-ojalgo',
                    'The ojalgo-backed solver for Relix OPTIMIZE and COVER EXACT.',
                    [sameVersion('relix', 'compile'),
                     ['org.ojalgo', 'ojalgo', ojalgoVersion, 'runtime']])
        }
        // No jar at all: a POM whose dependencies are the other three, for a client who
        // wants everything under one coordinate.
        bundle(MavenPublication) {
            artifactId = 'relix-all'
            pom.packaging = 'pom'
            describe(pom, 'relix-all',
                    'Relix with everything: the engine, the language reference and the solver.',
                    [sameVersion('relix', 'compile'),
                     sameVersion('relix-docs', 'compile'),
                     sameVersion('relix-solver-ojalgo', 'runtime')])
        }
    }

    // A directory, not a server. The release job publishes here, signs what lands,
    // zips it and hands the zip to the Central Portal — which takes a bundle in
    // exactly this layout and validates it as a unit.
    //
    // Publishing to a repository is also what produces the `.md5`/`.sha1` files
    // Central requires beside every artifact; `publishToMavenLocal` does not write
    // them, so a bundle assembled by copying out of `~/.m2` is rejected for checksums
    // it never had. The staging directory is the shape that has them by construction.
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
        // Work in progress, for a front end that needs an engine change before it is
        // released (#1134). Central's own snapshot repository: public, readable with no
        // credentials, and written with the token the release already uses. The URL can
        // be overridden (-PsnapshotRepository=file:///...) to rehearse a publish locally.
        maven {
            name = 'snapshots'
            url = findProperty('snapshotRepository') ?: 'https://central.sonatype.com/repository/maven-snapshots/'
            if (url.scheme in ['http', 'https']) {
                credentials {
                    username = System.getenv('CENTRAL_TOKEN_USERNAME')
                    password = System.getenv('CENTRAL_TOKEN_PASSWORD')
                }
            }
        }
    }
}

// ---------------------------------------------------------------------------
// The POM, checked here rather than at the Portal.
//
// Maven Central rejects a POM missing name, description, url, licenses, developers
// or scm. That rejection arrives after the version is tagged, the GitHub release is
// published and the artifacts are built — the most expensive moment available for
// learning that a field is absent, and a release number on Central cannot be reused
// even after a failed upload is dropped.
//
// So the questions are asked during `check`, where the answer costs nothing. It reads
// the POM Gradle actually generates rather than the DSL above, which is the only
// version that can be wrong in a way inspection would miss.
// ---------------------------------------------------------------------------
def publicationNames = ['relix', 'docs', 'solver', 'bundle']

def validatePom = tasks.register('validatePom') {
    group = 'verification'
    description = 'Checks every generated POM carries everything Maven Central requires.'

    def pomTasks = publicationNames.collect { name ->
        tasks.named("generatePomFileFor${name.capitalize()}Publication")
    }
    dependsOn pomTasks
    def pomFiles = pomTasks.collect { t -> t.map { it.destination } }
    pomFiles.each { inputs.file(it) }

    doLast {
        pomFiles.each { pomFileProvider ->
            def pomFile = pomFileProvider.get()
            def pom = new XmlSlurper().parse(pomFile)
            // Each entry is a required element and the evidence that it is filled in — a
            // present-but-empty `<developers/>` satisfies Central's schema and not its
            // validator, so the check is for content rather than for the tag.
            def required = [
                    'name'        : pom.name.text(),
                    'description' : pom.description.text(),
                    'url'         : pom.url.text(),
                    'licenses'    : pom.licenses.license.name.text(),
                    'developers'  : pom.developers.developer.collect {
                        it.name.text() + it.organization.text() + it.email.text()
                    }.join(),
                    'scm/url'     : pom.scm.url.text(),
                    'scm/conn'    : pom.scm.connection.text(),
            ]
            def missing = required.findAll { !it.value?.trim() }.keySet()
            if (missing) {
                throw new GradleException("the published POM would be rejected by Maven "
                        + "Central: nothing in ${missing.join(', ')} (${pomFile})")
            }
            // The point of the split: an embedder who takes `relix` alone downloads the
            // engine and nothing else. A dependency creeping back into its POM — the
            // solver's library above all — would undo that without failing anything.
            if (pom.artifactId.text() == 'relix' && pom.dependencies.dependency.size() > 0) {
                throw new GradleException("the relix POM must declare no dependencies, and it "
                        + "names ${pom.dependencies.dependency.collect { it.artifactId.text() }}: "
                        + "an optional provider belongs in its own artifact (${pomFile})")
            }
            // A SNAPSHOT is publishable to a snapshot repository and to nowhere else, so
            // this is a note rather than a failure: every ordinary `./gradlew build` runs
            // at the default version and must not be told it is doing something wrong.
            if (pom.version.text().endsWith('SNAPSHOT')) {
                logger.info('validatePom: {} is a snapshot; a Central release needs '
                        + '-PrelixVersion=<release version>', pom.version.text())
            }
        }
    }
}

// ---------------------------------------------------------------------------
// No class in two jars.
//
// The published jars are separate modules, and a client may put any combination of them
// on a module path. Two modules holding one package do not start ("reads package … from
// both"), and on a class path two copies of one class are whichever loads first. So the
// check is on packages, which is the stronger claim, and it reads the jars themselves
// rather than the build that produced them. It also holds the engine jar to carrying no
// language reference page, those having left it for relix-docs.
// ---------------------------------------------------------------------------
def checkArtifacts = tasks.register('checkArtifacts') {
    group = 'verification'
    description = 'Checks no package is in two published jars, and the engine jar holds no reference pages.'
    def jars = [tasks.named('jar'), docsJar, solverJar].collect { t -> t.flatMap { it.archiveFile } }
    jars.each { inputs.file(it) }
    doLast {
        def owners = [:].withDefault { [] as Set }
        jars.each { jarProvider ->
            def jarFile = jarProvider.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    def name = entry.name
                    if (name.endsWith('.class') && name != 'module-info.class') {
                        owners[name.substring(0, name.lastIndexOf('/'))] << jarFile.name
                    }
                }
            }
        }
        def shared = owners.findAll { it.value.size() > 1 }
        if (shared) {
            throw new GradleException('a package is in more than one published jar: '
                    + shared.collect { "${it.key.replace('/', '.')} in ${it.value.sort()}" }.join('; '))
        }
        def engine = jars[0].get().asFile
        new java.util.zip.ZipFile(engine).withCloseable { zip ->
            // The built-in function pages stay: a function library documents its own
            // functions, and the engine serves them through the function catalogue.
            def pages = zip.entries().findAll {
                it.name.endsWith('.md') && !it.name.startsWith('docs/reference/functions/')
            }.collect { it.name }
            if (pages) {
                throw new GradleException("the engine jar carries ${pages.size()} reference "
                        + "page(s), which belong in relix-docs: ${pages.take(5)}")
            }
        }
    }
}

tasks.named('check') { dependsOn validatePom, checkArtifacts }

// ---------------------------------------------------------------------------
// The consumer smoke test — the published artifacts, used the way a stranger would.
//
// Every other test here resolves *projects*. That is what hides a packaging mistake: a
// class left out of the merge, a service file overwritten, a package missing from the
// module descriptor, a dependency missing from a POM — each compiles and passes
// everything, then fails for the first person to depend on the release.
//
// Each variant is a *separate build*, which is the only shape that proves anything:
// inside this one, Gradle prefers a project over an external module of the same
// coordinates, so the POM would never be read at all. One per way of depending on the
// engine, and the last on the module path rather than the class path, because a
// descriptor mistake only shows there.
//
//   ./gradlew :relix-dist:consumerSmokeTest
// ---------------------------------------------------------------------------
def consumerVariants = [
        // name         dependencies                                   solver  docs   modular
        [name: 'alone',  deps: ['relix'],                                solver: false, docs: false, modular: false],
        [name: 'solver', deps: ['relix', 'relix-solver-ojalgo'],         solver: true,  docs: false, modular: false],
        [name: 'docs',   deps: ['relix', 'relix-docs'],                  solver: false, docs: true,  modular: false],
        [name: 'all',    deps: ['relix-all'],                            solver: true,  docs: true,  modular: false],
        [name: 'modular', deps: ['relix-all'],                           solver: true,  docs: true,  modular: true],
]

def consumerRuns = consumerVariants.collect { variant ->
    def root = layout.buildDirectory.dir("consumerSmoke/${variant.name}")
    def write = tasks.register("writeConsumer${variant.name.capitalize()}") {
        description = "Generates the standalone '${variant.name}' consumer of the published artifacts."
        inputs.dir('src/consumerSmoke/java')
        inputs.property('version', project.version)
        inputs.property('variant', variant.toString())
        outputs.dir(root)
        doLast {
            def dir = root.get().asFile
            dir.deleteDir()
            def sources = new File(dir, 'src/main/java')
            sources.mkdirs()
            new File(dir, 'settings.gradle').text = "rootProject.name = 'relix-consumer-${variant.name}'\n"
            def dependencyLines = variant.deps
                    .collect { "    implementation 'com.darkcollective.relix:${it}:${project.version}'" }
                    .join('\n')
            def launch = variant.modular
                    ? "application {\n    mainModule = 'relix.consumer'\n    mainClass = 'consumer.ConsumerSmoke'\n}"
                    : "application {\n    mainClass = 'consumer.ConsumerSmoke'\n}"
            new File(dir, 'build.gradle').text = """\
plugins { id 'application' }
repositories { mavenLocal(); mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
${dependencyLines}
}
${launch}
run { args 'solver=${variant.solver}', 'docs=${variant.docs}', 'modular=${variant.modular}' }
"""
            copy {
                from 'src/consumerSmoke/java'
                into sources
            }
            if (variant.modular) {
                // Reading the docs module, as a tool that shows the reference would. The
                // solver is not named: a provider joins the module graph because the
                // engine `uses` its service, which is the claim being tested.
                new File(sources, 'module-info.java').text = """\
module relix.consumer {
    requires com.darkcollective.relix;
    requires com.darkcollective.relix.docs;
}
"""
            }
        }
    }
    tasks.register("consumerSmoke${variant.name.capitalize()}", GradleBuild) {
        group = 'verification'
        description = "Runs the '${variant.name}' consumer of the published artifacts, from ~/.m2."
        dir = root
        // `tasks` is GradleBuild's own property here, which shadows the project's task
        // container — hence the qualified name on the line below.
        tasks = ['run']
        dependsOn write, project.tasks.named('publishToMavenLocal')
    }
}

tasks.register('consumerSmokeTest') {
    group = 'verification'
    description = 'Runs every standalone consumer of the published artifacts, from ~/.m2.'
    dependsOn consumerRuns
}

// ---------------------------------------------------------------------------
// Snapshots (#1134)
//
//   ./gradlew :relix-dist:publishSnapshot -PrelixVersion=<next>-SNAPSHOT
//
// A snapshot is named for the release it leads to, so its version is the next release's
// number with -SNAPSHOT: Maven and Gradle both sort 1.1.0-SNAPSHOT before 1.1.0-rc1 and
// 1.1.0. The two repositories each refuse the other's kind of version, because either
// mistake is expensive: a snapshot staged for Central fails validation after the tag
// exists, and a release in the snapshot repository is a mutable copy of a version that
// must never change.
// ---------------------------------------------------------------------------
def isSnapshot = { v -> v.toString().endsWith('-SNAPSHOT') }

tasks.register('publishSnapshot') {
    group = 'publishing'
    description = 'Publishes every artifact to the snapshot repository (a -SNAPSHOT version only).'
    dependsOn 'publishAllPublicationsToSnapshotsRepository'
}

tasks.register('publishStaging') {
    group = 'publishing'
    description = 'Publishes every artifact to the staging directory a release uploads (a release version only).'
    dependsOn 'publishAllPublicationsToStagingRepository'
}

tasks.matching { it.name ==~ /publish\w+PublicationToSnapshotsRepository/ }.configureEach {
    def v = project.version
    doFirst {
        if (!isSnapshot(v)) {
            throw new GradleException("The snapshot repository takes -SNAPSHOT versions only, and this is ${v}. " +
                    "Pass -PrelixVersion=<next release>-SNAPSHOT.")
        }
    }
}

tasks.matching { it.name ==~ /publish\w+PublicationToStagingRepository/ }.configureEach {
    def v = project.version
    doFirst {
        if (isSnapshot(v)) {
            throw new GradleException("A release cannot be a snapshot: ${v}. Snapshots go to the snapshot repository " +
                    "(publishSnapshot).")
        }
    }
}
